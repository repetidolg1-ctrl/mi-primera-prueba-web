<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Web con Modo Claro y Oscuro</title>
    <!-- Incluir Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configurar Tailwind para soportar clases manuales de dark mode con la clase 'dark' en el elemento html
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Encabezado -->
    <header class="w-full px-6 py-4 flex justify-between items-center max-w-5xl mx-auto">
        <h1 class="text-xl font-bold tracking-tight">Miprimerapagina.com</h1>
        
        <!-- Botón para cambiar el modo -->
        <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition focus:outline-none" aria-label="Cambiar modo">
            <!-- Icono Sol (Se muestra en modo oscuro) -->
            <svg id="sun-icon" class="w-5 h-5 hidden dark:block text-yellow-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <!-- Icono Luna (Se muestra en modo claro) -->
            <svg id="moon-icon" class="w-5 h-5 block dark:hidden text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow flex items-center justify-center px-6">
        <div class="text-center max-w-xl mx-auto space-y-6">
            <h2 class="text-4xl font-extrabold tracking-tight">Bienvenido a mi sitio web</h2>
            <p class="text-lg text-gray-600 dark:text-gray-400">
                Esta es una página web esta pagina contiene algunos de mis juegos favoritos :D.
            </p>
            <img src="ilustracion-controlador-juego_23-2151602205.avif" alt="" width="100px" >
            <div>
                <a href="#contacto" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow transition">
                    Ver algunos de mis juegos favoritos
                </a>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="w-full text-center py-6 text-sm text-gray-500 dark:text-gray-500">
        &copy; 2026 Miprimerapagina. Todos los derechos reservados.
    </footer>

    <!-- Script de Lógica para el Tema -->
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Comprobar preferencia guardada o del sistema al cargar
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        // Evento click del botón
        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });
    </script>
    

</body>
</html>
